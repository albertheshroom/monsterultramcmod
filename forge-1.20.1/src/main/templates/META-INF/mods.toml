modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "All Rights Reserved"
issueTrackerURL = "https://github.com/albertheshroom/monsterultramcmod/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "assets/monsterultra/icon.png"
authors = "albertheshroom"
description = '''Adds Monster Ultra energy drinks - cans and buckets of 16 flavors, essences, the Chemistry Table and the Caffeinated effect.'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "farmersdelight"
mandatory = true
versionRange = "[1.20.1-1.3.0,)"
ordering = "AFTER"
side = "BOTH"
