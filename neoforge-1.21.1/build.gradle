plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

// One version for both loaders: read it from the Fabric build's gradle.properties
// unless it is passed explicitly (-Pversion=... in CI).
def rootProps = new Properties()
file('../gradle.properties').withInputStream { rootProps.load(it) }
version = project.findProperty('version') && project.version != 'unspecified' ? project.version : rootProps.getProperty('version')
group = mod_group_id

base {
    // monsterultra-neoforge-1.21.1-<version>.jar
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup('maven.modrinth')
        }
    }
}

dependencies {
    // Farmer's Delight: Monster Energy buckets are cooked in its Cooking Pot.
    implementation "maven.modrinth:farmers-delight:${farmers_delight_version}"
}


def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : project.version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

processResources {
    from('../src/main/resources/assets') {
        into 'assets'
        exclude 'monsterultra/items/**'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
